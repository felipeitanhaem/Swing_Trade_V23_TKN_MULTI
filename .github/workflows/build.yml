name: Build APK V23
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Expo Prebuild clean
        run: npx expo prebuild --platform android --clean

      - name: Fix colors.xml - OBRIGATORIO para Expo 50
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="splashscreen_background">#FFFFFF</color>
            <color name="splashscreen_statusbar">#FFFFFF</color>
            <color name="splashscreen_navigationbar">#FFFFFF</color>
            <color name="colorPrimary">#FFFFFF</color>
            <color name="colorPrimaryDark">#FFFFFF</color>
          </resources>
          EOF
          cat android/app/src/main/res/values/colors.xml

      - name: Build APK Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v23
          path: android/app/build/outputs/apk/release/app-release.apk
